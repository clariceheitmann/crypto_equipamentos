<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/vistoria_cad.js"defer></script>
    <title>Cadastrar Vistoria</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Vistoria</h1>
        <form>
            <label for="data">Data</label>
            <input type="date" id="data" required><br>

            <label for="status">Status</label>
            <select id="status">
                <option value="PENDENTE">PENDENTE</option>
                <option value="REALIZADA"REALIZADA></option>
            </select><br>

            <label for="idEquipamento">Código do Equipamento</label>
            <input type="number" id="idEquipamento" required><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
