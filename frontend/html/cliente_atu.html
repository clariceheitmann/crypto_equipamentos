<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cliente_atu.js"defer></script>
    <title>Atualizar Cliente</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Atualizar Cliente</h1>
        <form>
            <label for="id">Código do Cliente</label>
            <input type="number" id="id" required><br>

            <label for="nome">Nome</label>
            <input type="text" id="nome" required><br>

            <label for="cpf">CPF</label>
            <input type="number" id="cpf" required><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
